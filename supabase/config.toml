# ApnaPick Supabase local configuration
# https://supabase.com/docs/guides/cli/config

project_id = "apnapick"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
# OpenStreetMap Pune listings (ODbL). Do not run pune_dev.sql against hosted projects.
enabled = true
sql_paths = ["./seed/pune_osm_catalog.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000/reset-password",
]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
